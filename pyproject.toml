[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckflix"
version = "0.2.0"
description = "Safe shipboard media inventory and import management"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deckflix = "deckflix.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deckflix*"]
